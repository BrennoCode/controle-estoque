<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão de Estoque</title>
</head>

<body>
    <header>
    <h1>CONTROLE DE ESTOQUE</h1>
</header>

    <div>
<section>
    <article>
        <h2>Resumo do estoque</h2>
        <h3>Produtos cadastrados</h3>
        <p id="total-produtos">0</p>

        <h3>Total de Unidades</h3>
        <p id="total-unidades">0</p>

        <h3>Estoque Baixo</h3>
        <p id="total-estoque-baixo">0</p>
    </article>
</section>
</div>

<section>
    <h2>Cadastrar Produto</h2>
    <form id="form-produtos">
        <div>
            <label for="nome-produto">Nome do Produto</label>
            <input type="text" id="nome-produto" placeholder="Ex: Mouse sem fio" name="nomeProduto" required>
        </div>

        <div>
            <label for="codigo-produto">Código</label>
            <input type="text" id="codigo-produto" placeholder="Ex: NFE201203" name="codigoProduto" required>
        </div>

        <div>
            <label for="quantidade-inicial">Quantidade</label>
            <input type="number" id="quantidade-inicial" name="quantidadeInicial" min="0" value="0" required>
        </div>
        
        <div>
            <label for="estoque-minimo">Estoque Minimo</label>
            <input type="number" id="estoque-minimo" name="estoqueMinimo" min="0" value="0" required>
        </div>

        <div class="categorias">
            <label for="categoria-produto">Categoria</label>
            <select id="categoria-produto" name="categoriaProduto" required>
                <option value="">Selecione uma categoria</option>
                <option value="informatica">Informática</option>
                <option value="escritorio">Escritório</option>
                <option value="papelaria">Papelaria</option>
            </select>
        </div>

        <button type="submit">Cadastrar produto</button>

    </form>
</section>

<div class="pesquisa">
    <h2>Produtos</h2>
    <label for="pesquisa-produto">Pesquisar Produtos</label>
    <input type="search" id="pesquisa-produto" name="pesquisaProduto" placeholder="Digite um nome ou código do produto">
    <button id="botao-pesquisa">Pesquisar</button>
</div>

<div class="tabela-de-produtos">
    <table>
        <caption>Lista de produtos cadastrados</caption>

        <thead>
            <tr>
                <th scope="col">Código</th>
                <th scope="col">Produto</th>
                <th scope="col">Categoria</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Situações</th>
            </tr>
        </thead>

        <tbody id="lista-produtos">
            <td colspan="6">Nenhum produto cadastrado.</td>
        </tbody>
    </table>
</div>

<div>
    <fieldset>
        <legend>Tipo de movimentação</legend>

        <label>
            <input type="radio" name="tipoMovimentacao" value="entrada" required>
            entrada
        </label>
            <input type="radio" name="tipoMovimentacao" value="saida" required>
            saída
        <label>
    </fieldset>
</div>

<div>
    <textarea id="motivo-movimentacao" name="motivoMovimentacao" rows="3" placeholder="Ex: Compra de fornecedor" required>
    </textarea>
</div>

<div>
    <p id="mensagem-produto" role="status" aria-live="polite">    
    </p>
</div>
    </body>
</html>
